<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132b1e" />
      <stop offset="100%" stop-color="#0a1811" />
    </linearGradient>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#favGrad)" stroke-width="1.8" opacity="0.6" />

  <!-- Outer Cyber Hexagon Track -->
  <polygon points="32,7 54,20 54,44 32,57 10,44 10,20" fill="none" stroke="url(#favGrad)" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Hexagon Vertex Nodes -->
  <circle cx="32" cy="7" r="2" fill="#34d399" />
  <circle cx="54" cy="20" r="1.6" fill="#10b981" />
  <circle cx="54" cy="44" r="1.6" fill="#10b981" />
  <circle cx="32" cy="57" r="2" fill="#34d399" />
  <circle cx="10" cy="44" r="1.6" fill="#10b981" />
  <circle cx="10" cy="20" r="1.6" fill="#10b981" />

  <!-- Stylized Monogram "RA" -->
  <text x="32" y="39.5" font-family="'Space Grotesk', 'IBM Plex Sans', -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="-1px">
    <tspan fill="#34d399">R</tspan><tspan fill="#ffffff">A</tspan>
  </text>
</svg>

